function fmt(n) {
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : String(r).replace('.', ',');
}
function fmtEN(n) {
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : String(r);
}
function num(n, lang) { return lang === 'id' ? fmt(n) : fmtEN(n); }
function piFor(r) { return (Math.abs(r % 7) < 1e-9) ? 22 / 7 : 3.14; }
function piLabel(r, lang) {
  const is227 = Math.abs(r % 7) < 1e-9;
  if (lang === 'id') return is227 ? 'π = 22/7 (r kelipatan 7)' : 'π = 3,14 (r bukan kelipatan 7)';
  return is227 ? 'π = 22/7 (r is a multiple of 7)' : 'π = 3.14 (r is not a multiple of 7)';

const AudioSys = {
  ctx: null, master: null, on: true,
  init() {
    try {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
    } catch (e) { /* audio unavailable — game works without it */ }
  },
  tone(freq, dur, gain) {
    try {
      if (!this.ctx || !this.on) return;
      const t = this.ctx.currentTime;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.15, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
    } catch (e) {}
  },
  chime() { this.tone(660, 0.18, 0.16); setTimeout(() => this.tone(880, 0.25, 0.16), 90); },
  click() { this.tone(520, 0.07, 0.07); }
};

/* ================= navigation & station shell ================= */
function renderNav() {
  const names = I18N[state.lang].stationNames;
  let html = '';
  for (let i = 1; i <= 5; i++) {
    html += '<button class="navbtn' + (state.station === i ? ' active' : '') + '" data-st="' + i + '">' + (state.lang === 'en' ? 'Station ' : 'Stasiun ') + i + ' — ' + names[i - 1] + '</button>';
  }
  html += '<button class="navbtn formula" id="navFormulaBtn">' + T('formulaSheet') + '</button>';
  $('stationNav').innerHTML = html;
  $('stationNav').querySelectorAll('.navbtn[data-st]').forEach(b => {
    b.addEventListener('click', () => { AudioSys.init(); AudioSys.click(); showStation(parseInt(b.getAttribute('data-st'), 10)); });
  });
  const fb = $('navFormulaBtn');
  if (fb) fb.addEventListener('click', () => { AudioSys.init(); openFormula(); });
}
function showStation(n) {
  state.station = n;
  renderNav();
  renderStation();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderStation() {
  const s = state.station;
  let html = '';
  if (s === 1) html = renderS1();
  else if (s === 2) html = renderS2();
  else if (s === 3) html = renderS3();
  else if (s === 4) html = renderS4();
  else html = renderS5();
  $('station').innerHTML = html;
  afterRenderStation();
}
function stationHead(num, titleEn, titleId, introEn, introId) {
  const L = state.lang;
  return '<div class="card"><h2>' + (L === 'en' ? 'Station ' : 'Stasiun ') + num + ' — ' + (L === 'en' ? titleEn : titleId) + '</h2>' +
    '<p>' + (L === 'en' ? introEn : introId) + '</p>';
}
function scorePill(st) {
  return '<span class="scorepill" id="score-s' + st + '">' + T('yourScore') + ': ' + state.scores[st] + ' / ' + state.totalQ[st] + '</span>';
}
function unitFor(q) {
  return (q.kind.indexOf('area') !== -1) ? 'cm²' : 'cm';
}
function renderPractice(st) {
  const L = state.lang;
  const qs = PRACTICE[st];
  let html = '<h3>✏️ ' + T('practice') + ' &nbsp;' + scorePill(st) + '</h3>';
  qs.forEach((q, qi) => {
    const a = state.answers[q.id];
    const letters = ['A', 'B', 'C', 'D'];
    html += '<div class="qbox" id="box-' + q.id + '"><h4>Q' + (qi + 1) + '. ' + (L === 'en' ? q.q_en : q.q_id) + '</h4><div class="optgrid">';
    q.opts.forEach((o, oi) => {
      let cls = 'optbtn';
      let dis = '';
      if (a && a.done) {
        dis = ' disabled';
        if (oi === q.correct) cls += ' right';
        else if (a.picked === oi) cls += ' wrongpick';
        else cls += ' dim';
      } else if (a && a.tried && a.tried.indexOf(oi) !== -1) {
        cls += ' wrongpick'; dis = ' disabled';
      }
      html += '<button class="' + cls + '"' + dis + ' data-q="' + q.id + '" data-opt="' + oi + '">' + letters[oi] + '. ' + num(o, L) + ' ' + unitFor(q) + '</button>';
    });
    html += '</div>';
    const fbCls = (a && a.done) ? 'fb ok' : '';
    const fbTxt = (a && a.done) ? (T('correct') + ' <b>' + (L === 'en' ? q.work_en : q.work_id) + '</b>') : '';
    html += '<div class="fb ' + fbCls + '" id="fb-' + q.id + '">' + fbTxt + '</div></div>';
  });
  return html;
}
function findQ(qid) {
  for (let st = 1; st <= 5; st++) {
    const q = PRACTICE[st].find(x => x.id === qid);
    if (q) return { q, st };
  }
  return null;
}
function handleAnswer(btn) {
  const qid = btn.getAttribute('data-q');
  const opt = parseInt(btn.getAttribute('data-opt'), 10);
  const found = findQ(qid);
  if (!found) return;
  const q = found.q, st = found.st;
  const a = state.answers[qid] || (state.answers[qid] = { tries: 0, done: false, tried: [] });
  if (a.done) return;
  const L = state.lang;
  const box = $('box-' + qid);
  const fb = $('fb-' + qid);
  if (opt === q.correct) {
    a.done = true;
    state.scores[st]++;
    AudioSys.chime();
    const btns = box.querySelectorAll('.optbtn');
    btns.forEach((b, i) => {
      b.disabled = true;
      if (i === q.correct) b.classList.add('right');
      else if (a.tried.indexOf(i) !== -1) b.classList.add('wrongpick');
      else b.classList.add('dim');
    });
    fb.className = 'fb ok';
    fb.innerHTML = T('correct') + ' <b>' + (L === 'en' ? q.work_en : q.work_id) + '</b>';
    const pill = $('score-s' + st);
    if (pill) pill.textContent = T('yourScore') + ': ' + state.scores[st] + ' / ' + state.totalQ[st];
  } else {
    a.tries++;
    a.tried.push(opt);
    AudioSys.click();
    btn.disabled = true;
    btn.classList.add('wrongpick');
    fb.className = 'fb no';
    fb.innerHTML = T('wrong');
  }
}

function rollS2() {
  const wheel = $('s2wheel'), trace = $('s2trace'), label = $('s2rollLabel');
  if (!wheel) return;
  const r = state.s2r, pi = piFor(r), C = 2 * pi * r;
  const L = state.lang;
  const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  const dur = 1600;
  function frame(now) {
    const p = Math.min(1, (now - t0) / dur);
    const x = state.s2startX + p * state.s2dist;
    const rot = p * 360;
    wheel.setAttribute('transform', 'translate(' + x + ',' + state.s2cy + ') rotate(' + rot + ')');
    trace.setAttribute('x2', String(x));
    if (p < 1) {
      if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
    } else {
      label.textContent = (L === 'en' ? 'Distance rolled = C = ' : 'Jarak menggelinding = K = ') + num(C, L) + ' cm';
      AudioSys.chime();
    }
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  else frame(t0 + dur);
}

/* ================= Station 3 — Area (sector dissection) ================= */
function drawS3() {
  const r = state.s3r, t = state.s3mix / 100;
  const pi = piFor(r);
  const A = pi * r * r;
  const L = state.lang;
  $('s3rVal').textContent = num(r, L) + ' cm';
  $('s3mixVal').textContent = Math.round(t * 100) + '%';
  $('s3read').innerHTML =
    (L === 'en' ? 'Length of the strip ≈ π × r = ' : 'Panjang strip ≈ π × r = ') + '<b>' + num(pi * r, L) + ' cm</b><br>' +
    (L === 'en' ? 'Width of the strip = r = ' : 'Lebar strip = r = ') + '<b>' + num(r, L) + ' cm</b><br>' +
    '<b>A = π × r² = ' + (Math.abs(pi - 22 / 7) < 1e-9 ? '22/7' : (L === 'en' ? '3.14' : '3,14')) + ' × ' + num(r, L) + '² = <span class="bignum">' + num(A, L) + ' cm²</span></b><br>' +
    '<span class="muted">' + piLabel(r, L) + '</span>';
  /* sector dissection: 16 wedges, R px = r*4 */
  const R = Math.max(24, r * 4), cx = 170, cy = 120;
  const half = 11.25 * Math.PI / 180;
  const px1 = (R * Math.cos(-half)).toFixed(1), py1 = (R * Math.sin(-half)).toFixed(1);
  const px2 = (R * Math.cos(half)).toFixed(1), py2 = (R * Math.sin(half)).toFixed(1);
  const wedge = 'M 0 0 L ' + px1 + ' ' + py1 + ' A ' + R + ' ' + R + ' 0 0 1 ' + px2 + ' ' + py2 + ' Z';
  const slotW = 2 * R * Math.sin(half);
  const x0 = cx - (8 * slotW) / 2;
  let sectors = '';
  const cols = ['#60a5fa', '#93c5fd'];
  for (let i = 0; i < 16; i++) {
    const start = i * 22.5 + 11.25;
    const p = Math.floor(i / 2);
    const tx = x0 + p * slotW + slotW / 2;
    const ty = (i % 2 === 0) ? cy + R / 2 : cy - R / 2;
    const target = (i % 2 === 0) ? -90 : 90;
    let delta = ((target - start + 540) % 360) - 180;
    const rot = start + delta * t;
    const x = cx + (tx - cx) * t;
    const y = cy + (ty - cy) * t;
    sectors += '<g transform="translate(' + x.toFixed(1) + ',' + y.toFixed(1) + ') rotate(' + rot.toFixed(1) + ')">' +
      '<path d="' + wedge + '" fill="' + cols[i % 2] + '" stroke="#fff" stroke-width="1.5"/></g>';
  }
  const svg = '<svg viewBox="0 0 340 240" width="100%" height="240">' + sectors +
    '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#0c4a6e"/>' +
    '<text x="' + cx + '" y="' + (cy + R + 18) + '" font-size="14" font-weight="800" fill="#0c4a6e" text-anchor="middle">r = ' + num(r, L) + ' cm</text></svg>';
  $('s3fig').innerHTML = svg;
}
function animateS3() {
  const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  const dur = 1400;
  function frame(now) {
    const p = Math.min(1, (now - t0) / dur);
    state.s3mix = Math.round(p * 100);
    const sl = $('s3mix');
    if (sl) sl.value = String(state.s3mix);
    drawS3();
    if (p < 1 && typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  }
  if (typeof requestAnimationFrame !== 'undefined') requestAnimationFrame(frame);
  else { state.s3mix = 100; drawS3(); }
}
function renderS3() {
  const L = state.lang;
  let h = stationHead(3, 'Area of a Circle', 'Luas Lingkaran',
    'Cut a circle into sectors and rearrange them — they make a shape almost like a <b>rectangle</b>! Its length is about half the circumference (π × r) and its width is the radius (r). So Area = π × r × r = π × r².',
    'Potong lingkaran menjadi juring-juring lalu susun ulang — jadilah bangun yang hampir seperti <b>persegi panjang</b>! Panjangnya sekitar setengah keliling (π × r) dan lebarnya jari-jari (r). Jadi Luas = π × r × r = π × r².');
  h += '<div class="formula">A = π × r²<small>' + (L === 'en' ? 'Area = π × radius × radius' : 'Luas = π × jari-jari × jari-jari') + '</small></div>';
  h += '<div class="labrow"><div class="labviz"><div id="s3fig"></div>' +
    '<button class="btn" id="s3animBtn">▶ ' + (L === 'en' ? 'Rearrange the sectors!' : 'Susun ulang juringnya!') + '</button></div>' +
    '<div class="labctl">' +
    '<label for="s3r">' + (L === 'en' ? 'Radius:' : 'Jari-jari:') + ' <span class="bignum" id="s3rVal"></span></label>' +
    '<input type="range" id="s3r" min="5" max="21" step="1" value="' + state.s3r + '">' +
    '<label for="s3mix">' + (L === 'en' ? 'Rearrange:' : 'Susun ulang:') + ' <span class="bignum" id="s3mixVal"></span></label>' +
    '<input type="range" id="s3mix" min="0" max="100" step="1" value="' + state.s3mix + '">' +
    '<div class="readout" id="s3read"></div></div></div>';
  h += '<h3>📘 ' + T('workedExample') + '</h3><p>' + (L === 'en'
    ? 'r = 7 cm (multiple of 7, so π = 22/7): A = 22/7 × 7² = 22/7 × 49 = <b>154 cm²</b>. r = 10 cm (π = 3.14): A = 3.14 × 10² = 3.14 × 100 = <b>314 cm²</b>.'
    : 'r = 7 cm (kelipatan 7, jadi π = 22/7): L = 22/7 × 7² = 22/7 × 49 = <b>154 cm²</b>. r = 10 cm (π = 3,14): L = 3,14 × 10² = 3,14 × 100 = <b>314 cm²</b>.') + '</p>';
  h += renderPractice(3);
  h += '</div>';
  return h;
}

/* ================= Station 4 — Fraction Circles ================= */
function drawS4() {
  const frac = state.s4frac, r = state.s4r;
  const pi = piFor(r);
  const arc = frac * 2 * pi * r;
  const area = frac * pi * r * r;
  const perim = frac >= 1 ? arc : arc + 2 * r;
  const L = state.lang;
  const fracName = frac === 0.25 ? '1/4' : frac === 0.5 ? '1/2' : frac === 0.75 ? '3/4' : (L === 'en' ? 'Full' : 'Penuh');
  $('s4read').innerHTML = '<b>' + fracName + ' ' + (L === 'en' ? 'circle' : 'lingkaran') + ', r = ' + num(r, L) + ' cm</b><br>' +
    (L === 'en' ? 'Arc length = ' : 'Panjang busur = ') + '<b>' + num(arc, L) + ' cm</b><br>' +
    (L === 'en' ? 'Area of the part = ' : 'Luas bagiannya = ') + '<b>' + num(area, L) + ' cm²</b><br>' +
    (L === 'en' ? 'Perimeter of the part = ' : 'Keliling bagiannya = ') + '<b>' + num(perim, L) + ' cm</b>' + (frac < 1 ? ' <span class="muted">(' + (L === 'en' ? 'arc + 2 × r' : 'busur + 2 × r') + ')</span>' : '') + '<br>' +
    '<span class="muted">' + piLabel(r, L) + '</span>';
  /* sector drawing */
  const cx = 150, cy = 150, R = 105;
  const rad = a => a * Math.PI / 180;
  const a0 = -90, a1 = -90 + frac * 360;
  const p0 = [cx + R * Math.cos(rad(a0)), cy + R * Math.sin(rad(a0))];
  const p1 = [cx + R * Math.cos(rad(a1)), cy + R * Math.sin(rad(a1))];
  const large = frac > 0.5 ? 1 : 0;
  let inner;
  if (frac >= 1) {
    inner = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#fde68a" stroke="#b45309" stroke-width="3"/>';
  } else {
    inner = '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>' +
      '<path d="M ' + cx + ' ' + cy + ' L ' + p0[0].toFixed(1) + ' ' + p0[1].toFixed(1) + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1) + ' Z" fill="#fde68a" stroke="#b45309" stroke-width="3"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + p0[0].toFixed(1) + '" y2="' + p0[1].toFixed(1) + '" stroke="#92400e" stroke-width="2.5"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + p1[0].toFixed(1) + '" y2="' + p1[1].toFixed(1) + '" stroke="#92400e" stroke-width="2.5"/>';
  }
  const midA = a0 + frac * 180;
  const lx = cx + R * 0.55 * Math.cos(rad(midA)), ly = cy + R * 0.55 * Math.sin(rad(midA));
  const svg = '<svg viewBox="0 0 300 300" width="300" height="300">' + inner +
    '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#0c4a6e"/>' +
    '<text x="' + lx.toFixed(1) + '" y="' + (ly + 8).toFixed(1) + '" font-size="26" font-weight="900" fill="#92400e" text-anchor="middle">' + fracName + '</text>' +
    '<text x="' + cx + '" y="292" font-size="14" font-weight="800" fill="#0c4a6e" text-anchor="middle">r = ' + num(r, L) + ' cm</text></svg>';
  $('s4fig').innerHTML = svg;
  /* fraction button active state */
  ['0.25', '0.5', '0.75', '1'].forEach(f => {
    const b = $('frac-' + f);
    if (b) b.classList.toggle('active', Math.abs(state.s4frac - parseFloat(f)) < 1e-9);
  });
}
function renderS4() {
  const L = state.lang;
  let h = stationHead(4, 'Fraction Circles — 1/4, 1/2, 3/4 & Full', 'Lingkaran Pecahan — 1/4, 1/2, 3/4 & Penuh',
    'A circle can be cut into parts. For a fraction of a circle: <b>arc length = fraction × 2 × π × r</b> and <b>area = fraction × π × r²</b>. The perimeter of the part also includes the two straight radii (except for a full circle).',
    'Lingkaran bisa dipotong menjadi beberapa bagian. Untuk pecahan lingkaran: <b>panjang busur = pecahan × 2 × π × r</b> dan <b>luas = pecahan × π × r²</b>. Keliling bagiannya juga mencakup dua jari-jari yang lurus (kecuali lingkaran penuh).');
  h += '<div class="formula">' + (L === 'en' ? 'Arc = fraction × 2 × π × r &nbsp;•&nbsp; Area = fraction × π × r² &nbsp;•&nbsp; Perimeter = arc + 2 × r' : 'Busur = pecahan × 2 × π × r &nbsp;•&nbsp; Luas = pecahan × π × r² &nbsp;•&nbsp; Keliling = busur + 2 × r') + '</div>';
  h += '<div class="labrow"><div class="labviz"><div id="s4fig"></div></div><div class="labctl">' +
    '<label>' + (L === 'en' ? 'Choose the fraction:' : 'Pilih pecahannya:') + '</label>' +
    '<div class="fracbtns">' +
    '<button class="fracbtn" id="frac-0.25" data-frac="0.25">1/4</button>' +
    '<button class="fracbtn" id="frac-0.5" data-frac="0.5">1/2</button>' +
    '<button class="fracbtn" id="frac-0.75" data-frac="0.75">3/4</button>' +
    '<button class="fracbtn" id="frac-1" data-frac="1">' + (L === 'en' ? 'Full' : 'Penuh') + '</button></div>' +
    '<label for="s4r">' + (L === 'en' ? 'Radius:' : 'Jari-jari:') + ' <span class="bignum" id="s4rVal"></span></label>' +
    '<input type="range" id="s4r" min="1" max="21" step="1" value="' + state.s4r + '">' +
    '<div class="readout" id="s4read"></div></div></div>';
  h += '<h3>📘 ' + T('workedExample') + '</h3><p>' + (L === 'en'
    ? '1/2 circle, r = 14 cm: arc = 1/2 × 88 = <b>44 cm</b>, area = 1/2 × 616 = <b>308 cm²</b>. 1/4 circle, r = 14 cm: arc = 1/4 × 88 = <b>22 cm</b>, area = 1/4 × 616 = <b>154 cm²</b>. 3/4 circle, r = 7 cm: arc = 3/4 × 44 = <b>33 cm</b>, area = 3/4 × 154 = <b>115.5 cm²</b>.'
    : '1/2 lingkaran, r = 14 cm: busur = 1/2 × 88 = <b>44 cm</b>, luas = 1/2 × 616 = <b>308 cm²</b>. 1/4 lingkaran, r = 14 cm: busur = 1/4 × 88 = <b>22 cm</b>, luas = 1/4 × 616 = <b>154 cm²</b>. 3/4 lingkaran, r = 7 cm: busur = 3/4 × 44 = <b>33 cm</b>, luas = 3/4 × 154 = <b>115,5 cm²</b>.') + '</p>';
  h += renderPractice(4);
  h += '</div>';
  return h;
}
/* ================= Station 5 — Composite Figures ================= */
function svgFigA() {
  const L = state.lang;
  return '<svg viewBox="0 0 300 240" width="300" height="240">' +
    '<rect x="80" y="120" width="140" height="100" fill="#dbeafe" stroke="#0369a1" stroke-width="3"/>' +
    '<path d="M 80 120 A 70 70 0 0 1 220 120 Z" fill="#fde68a" stroke="#b45309" stroke-width="3"/>' +
    '<line x1="80" y1="120" x2="220" y2="120" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>' +
    '<text x="150" y="238" font-size="15" font-weight="800" fill="#0c4a6e" text-anchor="middle">14 cm</text>' +
    '<text x="70" y="175" font-size="15" font-weight="800" fill="#0c4a6e" text-anchor="end">10 cm</text>' +
    '<text x="150" y="105" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">r = 7 cm</text>' +
    '<text x="150" y="160" font-size="13" fill="#475569" text-anchor="middle">' + (L === 'en' ? 'rectangle' : 'persegi panjang') + '</text>' +
    '<text x="150" y="80" font-size="13" fill="#475569" text-anchor="middle">' + (L === 'en' ? 'semicircle' : 'setengah lingkaran') + '</text></svg>';
}
function svgFigB() {
  const L = state.lang;
  return '<svg viewBox="0 0 300 300" width="300" height="300">' +
    '<path d="M 75 75 H 225 V 225 H 75 Z M 150 75 A 75 75 0 1 0 150 225 A 75 75 0 1 0 150 75 Z" fill="#fbbf24" fill-rule="evenodd" stroke="#92400e" stroke-width="3"/>' +
    '<text x="150" y="65" font-size="15" font-weight="800" fill="#0c4a6e" text-anchor="middle">14 cm</text>' +
    '<text x="150" y="155" font-size="14" font-weight="800" fill="#7c2d12" text-anchor="middle">d = 14 cm</text>' +
    '<text x="150" y="245" font-size="13" fill="#475569" text-anchor="middle">' + (L === 'en' ? 'shaded = square − circle' : 'arsir = persegi − lingkaran') + '</text></svg>';
}
function svgFigC() {
  const L = state.lang;
  return '<svg viewBox="0 0 300 300" width="300" height="300">' +
    '<rect x="150" y="60" width="110" height="110" fill="#fde68a" stroke="#b45309" stroke-width="3"/>' +
    '<path d="M 150 170 L 260 170 A 110 110 0 1 1 150 60 Z" fill="#dbeafe" stroke="#0369a1" stroke-width="3"/>' +
    '<circle cx="150" cy="170" r="4" fill="#0c4a6e"/>' +
    '<text x="205" y="50" font-size="15" font-weight="800" fill="#0c4a6e" text-anchor="middle">14 cm</text>' +
    '<text x="270" y="120" font-size="15" font-weight="800" fill="#0c4a6e" text-anchor="middle">14 cm</text>' +
    '<text x="95" y="240" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">r = 14 cm</text>' +
    '<text x="120" y="120" font-size="13" fill="#475569" text-anchor="middle">3/4</text></svg>';
}
function renderS5() {
  const L = state.lang;
  let h = stationHead(5, 'Composite Figures', 'Bangun Gabungan',
    'Real shapes are often made of <b>several parts joined together</b>. For the <b>area</b>, add the areas of the parts (or subtract a cut-out part). For the <b>perimeter</b>, count ONLY the outer edges — never count a line that is inside the shape!',
    'Bangun nyata sering terdiri dari <b>beberapa bagian yang digabung</b>. Untuk <b>luas</b>, jumlahkan luas bagian-bagiannya (atau kurangi bagian yang dipotong). Untuk <b>keliling</b>, hitung HANYA sisi luarnya — jangan pernah menghitung garis yang ada di dalam bangun!');
  const svgs = { A: svgFigA(), B: svgFigB(), C: svgFigC() };
  COMPOSITES.forEach(c => {
    const steps = (L === 'en' ? c.steps_en : c.steps_id).map(s => '<li>' + s + '</li>').join('');
    h += '<div class="figcard"><h4>' + (L === 'en' ? c.title_en : c.title_id) + '</h4>' +
      '<p class="muted">' + (L === 'en' ? c.dims_en : c.dims_id) + '</p>' + svgs[c.key] +
      '<button class="btn ghost" data-steps="' + c.key + '">' + T('showSteps') + '</button>' +
      '<ol class="steps" id="steps-' + c.key + '">' + steps + '</ol></div>';
  });
  h += renderPractice(5);
  h += '</div>';
  return h;
}

/* ================= after render: attach station controls ================= */
function afterRenderStation() {
  const s = state.station;
  if (s === 1) {
    $('s1rVal').textContent = num(state.s1r, state.lang) + ' cm';
    drawS1();
    $('s1r').addEventListener('input', e => { state.s1r = parseInt(e.target.value, 10); $('s1rVal').textContent = num(state.s1r, state.lang) + ' cm'; drawS1(); });
  } else if (s === 2) {
    drawS2();
    $('s2r').addEventListener('input', e => { state.s2r = parseInt(e.target.value, 10); drawS2(); });
    $('s2rollBtn').addEventListener('click', () => { AudioSys.init(); rollS2(); });
  } else if (s === 3) {
    drawS3();
    $('s3r').addEventListener('input', e => { state.s3r = parseInt(e.target.value, 10); drawS3(); });
    $('s3mix').addEventListener('input', e => { state.s3mix = parseInt(e.target.value, 10); drawS3(); });
    $('s3animBtn').addEventListener('click', () => { AudioSys.init(); state.s3mix = 0; animateS3(); });
  } else if (s === 4) {
    $('s4rVal').textContent = num(state.s4r, state.lang) + ' cm';
    drawS4();
    $('s4r').addEventListener('input', e => { state.s4r = parseInt(e.target.value, 10); $('s4rVal').textContent = num(state.s4r, state.lang) + ' cm'; drawS4(); });
    ['0.25', '0.5', '0.75', '1'].forEach(f => {
      const b = $('frac-' + f);
      if (b) b.addEventListener('click', () => { AudioSys.init(); AudioSys.click(); state.s4frac = parseFloat(f); drawS4(); });
    });
  } else if (s === 5) {
    document.querySelectorAll('[data-steps]').forEach(b => {
      b.addEventListener('click', () => {
        AudioSys.init(); AudioSys.click();
        const el = $('steps-' + b.getAttribute('data-steps'));
        const open = el.classList.toggle('open');
        b.textContent = open ? T('hideSteps') : T('showSteps');
      });
    });
  }
}

/* ================= formula sheet ================= */
function renderFormula() {
  const L = state.lang;
  const rows = L === 'en' ? [
    ['Diameter', 'd = 2 × r'],
    ['Radius', 'r = d ÷ 2'],
    ['Circumference', 'C = π × d = 2 × π × r'],
    ['Area of a circle', 'A = π × r²'],
    ['Choosing π', 'π = 22/7 if r is a multiple of 7, otherwise π = 3.14'],
    ['1/2 circle', 'Arc = 1/2 × 2πr  •  Area = 1/2 × πr²  •  Perimeter = arc + 2r'],
    ['1/4 circle', 'Arc = 1/4 × 2πr  •  Area = 1/4 × πr²  •  Perimeter = arc + 2r'],
    ['3/4 circle', 'Arc = 3/4 × 2πr  •  Area = 3/4 × πr²  •  Perimeter = arc + 2r'],
    ['Composite figures', 'Perimeter = outer edges only  •  Area = add the parts (or subtract the cut-out)'],
  ] : [
    ['Diameter', 'd = 2 × r'],
    ['Jari-jari', 'r = d ÷ 2'],
    ['Keliling lingkaran', 'K = π × d = 2 × π × r'],
    ['Luas lingkaran', 'L = π × r²'],
    ['Memilih π', 'π = 22/7 jika r kelipatan 7, jika tidak π = 3,14'],
    ['1/2 lingkaran', 'Busur = 1/2 × 2πr  •  Luas = 1/2 × πr²  •  Keliling = busur + 2r'],
    ['1/4 lingkaran', 'Busur = 1/4 × 2πr  •  Luas = 1/4 × πr²  •  Keliling = busur + 2r'],
    ['3/4 lingkaran', 'Busur = 3/4 × 2πr  •  Luas = 3/4 × πr²  •  Keliling = busur + 2r'],
    ['Bangun gabungan', 'Keliling = hanya sisi luar  •  Luas = jumlahkan bagian-bagiannya (atau kurangi yang dipotong)'],
  ];
  let html = '<h2>' + T('sheetTitle') + '</h2><p>' + T('sheetSub') + '</p><table><tr><th>' + (L === 'en' ? 'What' : 'Apa') + '</th><th>' + (L === 'en' ? 'Formula' : 'Rumus') + '</th></tr>';
  rows.forEach(r => { html += '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td></tr>'; });
  html += '</table><div style="text-align:center;margin-top:14px"><button class="btn" id="closeSheetBtn">' + T('close') + '</button></div>';
  $('formulaSheet').innerHTML = html;
  $('closeSheetBtn').addEventListener('click', closeFormula);
}
function openFormula() { renderFormula(); $('formulaOverlay').classList.remove('hidden'); }
function closeFormula() { $('formulaOverlay').classList.add('hidden'); }

/* ================= language ================= */
function applyLang() {
  const L = state.lang;
  document.documentElement.lang = L;
  $('appTitle').textContent = T('appTitle');
  $('appSub').textContent = T('appSub');
  document.title = T('appTitle');
  $('langBtn').textContent = L === 'en' ? 'EN' : 'ID';
  renderNav();
  renderStation();
}

/* ================= init wiring ================= */
$('langBtn').addEventListener('click', () => {
  AudioSys.init();
  state.lang = state.lang === 'en' ? 'id' : 'en';
  applyLang();
});
$('soundBtn').addEventListener('click', () => {
  AudioSys.init();
  state.sound = !state.sound;
  AudioSys.on = state.sound;
  $('soundBtn').textContent = state.sound ? '🔊' : '🔇';
  $('soundBtn').classList.toggle('off', !state.sound);
  if (state.sound) AudioSys.chime();
});
$('formulaBtn').addEventListener('click', () => { AudioSys.init(); openFormula(); });
$('formulaOverlay').addEventListener('click', e => { if (e.target === $('formulaOverlay')) closeFormula(); });
$('station').addEventListener('click', e => {
  const t = e.target;
  if (t && t.getAttribute && t.getAttribute('data-q')) handleAnswer(t);
});
applyLang();
</script>
